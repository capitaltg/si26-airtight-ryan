# Scoring rubric v4. Row ids are a contract the scoring engine (#5) matches on via
# matched_rows; keep them stable. Mirrors docs/ideation/2-scoring-and-drift.md:43-51.
#
# `note` and `combination` are disclosure copy only. `version` moved to 4 because
# the math moved again: False Fact and Contradiction now hold the answer at 0 or
# below instead of merely subtracting, and an openly explained revision is its
# own row at 0 rather than a Contradiction. Bump it when the math moves.

version: 4
combination:
  - A red line fires first and suppresses every other row on that answer.
  - All other matching rows are added together, then held to the -2 to +2 range.
  - >-
    Most rows are charged once per answer no matter how many times they occur.
    False Fact is the exception: it is charged once per false fact.
  - >-
    Evidence Backed already includes the credit for Approach Cited, so the two are
    never paid together.
  - >-
    Contradiction covers unexplained conflicts with your own earlier answers. A
    claim the RFP or your written proposal refutes is a False Fact instead. One
    statement is never charged as both.
  - >-
    A False Fact or an unexplained Contradiction holds the answer at 0 or below.
    Covering the concern still counts, but it cannot lift a turn where something
    you said was not true.
  - >-
    Openly correcting yourself is not a Contradiction. Name what you said before,
    say what it is now, and say why it changed, and the turn is recorded as a
    Revision at no cost.
  - >-
    The over-limit penalty is measured after the -2 to +2 range is applied, so a
    long answer can reach -3.
  - >-
    A sub-question counts as answered only when a claim of the kind it asks for
    stands behind it. Naming the topic without a fact or a commitment counts as
    nothing, and a claim the solicitation or your proposal refutes does not count
    either.
rows:
  - id: red_line
    support_value: -2
    cap: 25
    description: >-
      Crossed a persona hard limit. Applies -2 this turn and pins the meter at 25
      for the rest of the session, so it can't recover. A dodge shows the same -2
      but has no cap.
  - id: dodge
    support_value: -2
    description: >-
      Dodged the main question. Costs -2 this turn, but no cap, so the meter can
      recover.
  - id: false_fact
    support_value: -1
    ceiling: 0
    description: Stated a fact that turned out false.
    note: >-
      Charged once per false fact, unlike every other row, which is charged once
      per answer. Holds the answer at 0 or below whatever else it earned.
  - id: contradiction
    support_value: -1
    ceiling: 0
    description: Contradicted an earlier answer or the written proposal.
    note: >-
      Covers unexplained conflicts with your own earlier answers, and holds the
      answer at 0 or below. A claim the RFP or your written proposal refutes is a
      False Fact instead. Openly revising an earlier answer is a Revision, not a
      Contradiction.
  - id: over_limit
    support_value: -1
    description: Answer exceeds the configured word or voice-duration limit.
    note: Applied after the -2 to +2 range, so a long answer can reach -3.
  - id: unsubstantiated
    support_value: 0
    description: Unsubstantiated claim or generic reassurance.
  - id: acknowledged_revision
    support_value: 0
    description: >-
      Openly revised an earlier answer: named what you said before, said what it
      is now, and said why it changed.
    note: Recorded so the change is visible, but not charged.
  - id: approach_cited
    support_value: 1
    description: Cited a concrete, compliant piece of the approach.
    note: >-
      Needs a claim of the kind the sub-question asks for. Not paid when Evidence
      Backed already fired on the same answer.
  - id: evidence_backed
    support_value: 2
    description: >-
      Backed with specific staffing, schedule, or past-performance evidence, or a
      checkable fact the solicitation or your written proposal confirms.
