# Scoring rubric v2. Row ids are a contract the scoring engine (#5) matches on via
# matched_rows; keep them stable. Mirrors docs/ideation/2-scoring-and-drift.md:43-51.
#
# `note` and `combination` are disclosure copy only. `version` stays at 2: it tags
# the scoring contract, and no row value or match condition changed when they were
# added. Bump it only when the math moves.

version: 2
combination:
  - A red line fires first and suppresses every other row on that answer.
  - All other matching rows are added together, then held to the -2 to +2 range.
  - >-
    Most rows are charged once per answer no matter how many times they occur.
    False Fact is the exception: it is charged once per false fact.
  - >-
    Evidence Backed already includes the credit for Approach Cited, so the two are
    never paid together.
  - >-
    Contradiction covers conflicts with your own earlier answers. A claim the RFP
    or your written proposal refutes is a False Fact instead - one statement is
    never charged as both.
  - >-
    The over-limit penalty is measured after the -2 to +2 range is applied, so a
    long answer can reach -3.
rows:
  - id: red_line
    support_value: -2
    cap: 25
    description: >-
      Crossed a persona hard limit. Applies -2 this turn and pins the meter at 25
      for the rest of the session, so it can't recover. A dodge shows the same -2
      but has no cap.
  - id: dodge
    support_value: -2
    description: >-
      Dodged the main question. Costs -2 this turn, but no cap, so the meter can
      recover.
  - id: false_fact
    support_value: -1
    description: Stated a fact that turned out false.
    note: Charged once per false fact, unlike every other row, which is charged once per answer.
  - id: contradiction
    support_value: -1
    description: Contradicted an earlier answer or the written proposal.
    note: >-
      Covers conflicts with your own earlier answers. A claim the RFP or your
      written proposal refutes is a False Fact instead.
  - id: over_limit
    support_value: -1
    description: Answer exceeds the configured word or voice-duration limit.
    note: Applied after the -2 to +2 range, so a long answer can reach -3.
  - id: unsubstantiated
    support_value: 0
    description: Unsubstantiated claim or generic reassurance.
  - id: approach_cited
    support_value: 1
    description: Cited a concrete, compliant piece of the approach.
    note: Not paid when Evidence Backed already fired on the same answer.
  - id: evidence_backed
    support_value: 2
    description: Backed with specific staffing, schedule, or past-performance evidence.
