[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airtight-server"
version = "0.1.0"
description = "Airtight POC server — federal-orals rehearsal with a deterministic, code-owned scoring engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "anthropic[bedrock]>=0.40",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.5",
  "pyyaml>=6.0",
  "python-frontmatter>=1.1",
  "amazon-transcribe>=0.6", # streaming SDK; boto3 has no streaming transcription
  "boto3>=1.35", # Polly
  "python-multipart>=0.0.9", # FastAPI UploadFile
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27", # required by fastapi.testclient.TestClient
  "ruff>=0.7",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
  "boto3-stubs[polly]>=1.35",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
# ../scripts so the replay harness (a stdlib-only HTTP client that lives
# outside the app package) can be unit-tested from here.
pythonpath = [".", "../scripts"]
testpaths = ["tests"]
markers = ["golden: live-Bedrock golden-set regression (skips without AWS credentials)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection puts Depends()/Query() calls in argument
# defaults by design; B008 flags that pattern but it is the intended idiom.
"app/api/*" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["amazon_transcribe.*"]
ignore_missing_imports = true
