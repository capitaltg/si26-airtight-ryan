# --- approach_cited (+1): concrete, compliant, but no backed commitment ----

- id: approach_architecture_concrete
  concern_id: technical_approach
  persona_id: technical_evaluator
  answer: >-
    The CMS is a containerized microservices application running on AWS
    GovCloud. PostgreSQL is the system of record, an event-driven pipeline
    handles the LCS data migration, and we expose a versioned REST API that the
    Payments Engine, Benefits Portal, and data warehouse read case status from.
  expected:
    support_delta: 2
    capped: false
    matched_rows: [evidence_backed]
  note: >-
    The FRAGILE branch this case was authored to decide, settled on the first
    live run: the proposal names AWS GovCloud and all three integrations, the
    model records tier-1 `supported` checks against them, and the empirical path
    to evidence_backed fires. That is the right call — rubric v3 added that path
    precisely so a claim the frozen documents confirm counts as evidence rather
    than as bare assertion, and these claims are confirmed. approach_cited is
    what an unconfirmable but concrete architecture earns; this one is
    checkable and checks out.

- id: approach_past_performance
  concern_id: past_performance
  persona_id: technical_evaluator
  answer: >-
    On the Veterans Claims Office modernization from 2021 to 2024 we migrated a
    1.8-million-case system to a cloud-native platform on schedule with zero
    data loss, and we hold an Exceptional CPARS rating for it.
  expected:
    support_delta: 2
    capped: false
    matched_rows: [evidence_backed]
  note: >-
    The written proposal confirms this project, so the checkable claims come back
    as tier-1 `supported` and the empirical path to evidence_backed fires. Under
    rubric v2 this was capped at approach_cited, which is the defect
    docs/issues/code-enforce-rubric-semantics.md reported.

- id: approach_transition_compliant
  concern_id: transition
  persona_id: program_rep
  answer: >-
    We complete transition-in within 90 calendar days, run the legacy and new
    systems in parallel for 60 days with reconciled outputs before retiring LCS,
    and take structured knowledge transfer from Meridian.
  expected:
    support_delta: 2
    capped: false
    matched_rows: [evidence_backed]
  note: >-
    Compliant, specified commitments covering the concern. Authored as
    approach_cited on the theory that no named personnel or past-performance
    backing meant no evidence, but every commitment here (90 calendar days, the
    60-day parallel run, knowledge transfer from Meridian) is confirmed almost
    word for word by proposal sections 1 and 3, so the empirical path pays +2 on
    the documents alone. Consistent with approach_architecture_concrete and
    false_fact_record_count, settled the same way on the same run. The cost is
    that the contrast with backed_transition_migration_lead is now weaker: both
