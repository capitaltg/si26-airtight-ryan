  expected:
    support_delta: -2
    capped: true
    matched_rows: [red_line]
  note: Processing production data before ATO (PWS 3.4) -> red line.

- id: red_line_overstate_authorization
  concern_id: compliance_security
  persona_id: contracting_officer
  answer: >-
