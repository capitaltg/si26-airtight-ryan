# Golden-set regression cases (task 8).
#
# Each case is a hand-graded exchange. The harness (test_golden.py) runs every
# case 3x against REAL Bedrock extraction -> the pure scoring engine and asserts:
#   1. stability  — all three runs agree with each other (temperature=0 + forced
#                   schema should make extraction deterministic), and
#   2. validity   — the score matches the hand grade below.
#
# The `expected` block is graded against the scoring engine AS BUILT
# (app/pipeline/scoring.py), not against an ideal. Three engine behaviours drive
# most of the combinations here, so keep them in mind when reading expectations:
#   - A crossed red line fires FIRST and alone: delta -2, capped, rows [red_line].
#   - A sub-question counts as addressed only when `evidence_claim_spans` links a
#     claim of the kind its `requires` tag asks for, and no document refutes that
#     claim. `approach_cited` (+1) then fires on any surviving full/partial row,
#     unless `evidence_backed` already did. So an on-topic negative answer (a
#     wrong fact, a contradiction) that still answers the question with a real
#     claim nets that -1 against a +1 -> delta 0. That is the engine.
#   - `evidence_backed` (+2) fires two ways: a commitment with
#     `backing == backed`, or an `empirical_checkable` claim confirmed by a
#     tier-1 `supported` fact_check. The second path is new in rubric v3, and it
#     is why several cases below are marked FRAGILE: whether the model bothers to
#     record a supported check decides +1 vs +2.
#   - A false fact or an unacknowledged contradiction now CEILINGS the turn at 0
#     (rubric v4): positive rows still match and still show their evidence, but
#     they cannot lift the delta above 0. An openly explained revision — earlier
#     position, new position, and the reason — is not a contradiction at all; it
#     matches `acknowledged_revision` at 0.
#
# CALIBRATION (step 3, needs AWS creds): expected values are authored from domain
# judgment. Run `pytest tests/golden -m golden -v`; for any case that swings
# across the 3 runs (extraction instability) add a worked exemplar to the
# relevant persona file and re-run; for any case whose stable score disagrees
# with the hand grade, decide whether the grade or the content is wrong. Log any
# case that will not settle.
#
# Coverage: every rubric row (red_line, dodge, unsubstantiated, false_fact,
# contradiction, acknowledged_revision, approach_cited, evidence_backed), 4
# red-line crossings, 3 Tier-0 contradictions and 1 Tier-0 revision (all of
# which require `prior_claims`), and 2 integrity-ceiling combinations.

# --- Red-line crossings (fire first, cap the meter) ------------------------

- id: red_line_onprem
  concern_id: technical_approach
  persona_id: technical_evaluator
  answer: >-
    For maximum control over the case data, we would host the modernized CMS
    on-premises in our own accredited data center rather than in a cloud
    environment.
  expected:
    support_delta: -2
    capped: true
    matched_rows: [red_line]
  note: PWS 3.1 forbids on-premises hosting -> concern red line.

- id: red_line_transition_six_months
  concern_id: transition
  persona_id: program_rep
  answer: >-
    Realistically, to protect the adjudicators, we would want about six months
    for transition-in so nothing gets rushed.
  expected:
    support_delta: -2
    capped: true
    matched_rows: [red_line]
  note: >-
    Six months exceeds the 90-calendar-day transition limit (PWS 3.3) -> red
    line.

- id: red_line_production_before_ato
  concern_id: compliance_security
  persona_id: contracting_officer
  answer: >-
    To keep the schedule tight, we would begin loading and processing live
