  expected:
    support_delta: -2
    capped: false
    matched_rows: [dodge]
  note: >-
    Topic switch away from the staffing-basis question, no figure and no
    commitment. Moved here from the risk concern during calibration, which the
    original FRAGILE note listed as the fallback if softening the answer did not
