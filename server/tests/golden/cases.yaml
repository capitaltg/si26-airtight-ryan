# --- false_fact (-1): a checkable claim that is refuted --------------------

- id: false_fact_record_count
  concern_id: technical_approach
  persona_id: technical_evaluator
  answer: >-
    We will migrate the roughly twelve million legacy case records in three
    oldest-first waves, with an automated reconciliation report after each wave.
  expected:
    support_delta: 0
    capped: false
    matched_rows: [false_fact, evidence_backed]
  note: >-
    ~42M records per PWS 3.1, so "twelve million" is refuted (-1). The wave +
    reconciliation approach is quoted almost verbatim from the proposal, so the
    model records a tier-1 `supported` check on it and the empirical path pays
    +2 rather than +1. Either way the v4 ceiling holds the turn at 0, which is
    the point of the case. This case swung between the two rows before the
    prompt asked for `SubQuestionCoverage.span`; with coverage no longer being
    silently discarded it settles on evidence_backed.

- id: false_fact_pm_years
  concern_id: key_personnel
  persona_id: contracting_officer
  answer: >-
    Our program manager, Karen Holloway, brings eighteen years managing federal
    software programs and is committed full-time.
  expected:
    support_delta: 0
    capped: false
    matched_rows: [false_fact, approach_cited]
  note: >-
    Proposal says 12 years, so "eighteen years" is refuted (-1); the answer still
    addresses the PM sub-questions (+1) -> net 0. FRAGILE under v3 for a
    different reason than v2: the "eighteen years" claim is refuted, so it can no
    longer satisfy pm_experience's `requires: fact`. The +1 now has to come from
    pm_commitment ("committed full-time"), which is a commitment claim and
    stands. If the model does not emit that claim the case falls to -1
    [false_fact]. Settled on the third calibration pass, and the swing it took to
    settle is the point: this case kept grading as a capped red line on about one
    live run in five, because both of key_personnel's red lines are about the PM's
    experience and an overstated number found a home in either. Narrowing
    `unsupported_experience` alone (the first pass) just moved the drift to
    `pm_underqualified`, whose own stated reason was incoherent -- 18 and 12 both
    clear the 10-year minimum. It took both red lines saying outright what they
    are not, plus a contracting_officer exemplar of the same shape on different
    personnel, to hold it at false_fact + approach_cited across 8 consecutive
    runs. Nothing in the engine changed.

# --- contradiction (-1): Tier-0 conflict with a prior claim ----------------

- id: contradiction_top_risk
  concern_id: risk
  persona_id: technical_evaluator
  prior_claims:
    - turn_index: 0
      text: Our biggest risk is data-migration integrity.
      type: commitment
      backing: specified
      span: the biggest risk is data-migration integrity
  answer: >-
    Earlier I would have pointed to data migration, but honestly our top risk is
    staffing ramp-up, which we mitigate with a bench of pre-cleared engineers
    ready to backfill.
  expected:
    support_delta: 0
    capped: false
    matched_rows: [contradiction, approach_cited]
  note: >-
    Reverses the prior top-risk claim (-1) but names a risk with a concrete
    mitigation, covering the concern (+1) -> net 0, now held there by the v4
    ceiling as well as by the sum. Mitigation is present so it does not trip the
    "no mitigation" risk red line. This is the deliberate near-miss for the
    revision bar: "Earlier I would have pointed to data migration" names the old
    and the new position but gives no reason for the change, so
    acknowledged_revision must stay false and this must stay a contradiction. If
    it grades as a revision, the three-part bar is not landing and the fix is a
    worked exemplar in the persona file, not a code change. Contrast
    acknowledged_revision_credited, which adds the reason.

